<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escala de Limpeza - Mairiporã</title>
  
  <!-- Importando a fonte Cabin do Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Biblioteca para ler arquivos CSV com segurança -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    body {
      font-family: 'Cabin', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">

  <div class="max-w-4xl mx-auto">
    <!-- Cabeçalho -->
    <header class="bg-[#015060] text-white p-6 rounded-[30px] shadow-md mb-6 flex justify-between items-center">
      <div>
        <h1 class="text-3xl text-center font-extrabold">Departamento de Limpeza Mairiporã</h1>
      </div>
    </header>

    <!-- Loading -->
    <div id="loading" class="text-center py-10">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-800 border-t-transparent"></div>
      <p class="text-gray-600 mt-2 font-medium">Carregando informações da escala...</p>
    </div>

    <!-- TELA 1: Lista dos 11 Departamentos -->
    <div id="view-lista" class="hidden">
      <h2 class="text-xl font-bold mb-4 text-gray-800">Selecione um Setor:</h2>
      <div id="grid-departamentos" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Renderizado dinamicamente -->
      </div>
    </div>

    <!-- TELA 2: Detalhes do Departamento -->
    <div id="view-detalhes" class="hidden bg-white p-6 rounded-[25px] shadow-md">
      <!-- Linha superior com Voltar na esquerda e Ficha de Limpeza na direita -->
      <div class="flex justify-between items-center mb-4">
        <button onclick="voltarParaLista()" class="text-lg text-blue-600 hover:underline flex items-center gap-2 font-medium">
          &#9664; Voltar
        </button>
        <button onclick="abrirFichaLimpeza()" class="bg-[#015060] text-white px-4 py-2 rounded-[20px] text-sm font-semibold hover:bg-[#013d4a] transition flex items-center gap-1 shadow-sm">
          📄 Ficha de Limpeza
        </button>
      </div>

      <h2 id="detalhe-nome" class="text-2xl font-bold text-gray-800 mb-2"></h2>
      
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 my-4 p-4 bg-gray-50 rounded-[25px] border">
        <div>
          <span class="block text-sm text-green-600 uppercase font-bold">Capitão</span>
          <span id="detalhe-capitao" class="text-base font-semibold text-gray-800"></span>
        </div>
        <div>
          <span class="block text-sm text-green-600 uppercase font-bold">Congregação</span>
          <span id="detalhe-congregacao" class="text-base font-semibold text-gray-800"></span>
        </div>
        <div>
          <span class="block text-sm text-green-600 uppercase font-bold">Horário / Instrução</span>
          <span id="detalhe-instrucoes" class="text-base font-semibold text-gray-800"></span>
        </div>
      </div>

      <h3 class="text-lg font-semibold text-gray-800 mb-2">Irmãos Designados</h3>
      <ul id="detalhe-voluntarios" class="list-disc list-inside space-y-1 text-gray-700 bg-white p-4 border rounded-[25px]">
        <!-- Lista de voluntários inserida via JS -->
      </ul>
    </div>
  </div>

  <!-- MODAL: Ficha de Limpeza -->
  <div id="modal-ficha" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-[25px] p-6 max-w-lg w-full max-h-[85vh] overflow-y-auto shadow-xl relative">
      <div class="flex justify-between items-center mb-4 border-b pb-3">
        <h3 id="ficha-titulo" class="text-xl font-bold text-[#015060]">Ficha de Limpeza</h3>
        <button onclick="fecharFichaLimpeza()" class="text-gray-400 hover:text-gray-700 text-2xl font-bold px-2">&times;</button>
      </div>

      <div class="space-y-4">
        <div>
          <span class="block text-xs text-green-600 uppercase font-bold">Materiais Necessários</span>
          <div id="ficha-materiais" class="text-sm text-gray-800 mt-1 bg-gray-50 p-3 rounded-[15px] border"></div>
        </div>

        <div>
          <span class="block text-xs text-green-600 uppercase font-bold">Limpeza Durante o Evento</span>
          <div id="ficha-durante" class="text-sm text-gray-800 mt-1 bg-gray-50 p-3 rounded-[15px] border"></div>
        </div>

        <div>
          <span class="block text-xs text-green-600 uppercase font-bold">Limpeza ao Final de Cada Dia</span>
          <div id="ficha-fim" class="text-sm text-gray-800 mt-1 bg-gray-50 p-3 rounded-[15px] border"></div>
        </div>
      </div>

      <button onclick="fecharFichaLimpeza()" class="w-full mt-5 bg-gray-200 text-gray-800 font-bold py-2.5 rounded-[20px] hover:bg-gray-300 transition">
        Fechar
      </button>
    </div>
  </div>

  <script>
    // Link do CSV gerado no "Publicar na Web" do Google Sheets
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRwlgbpIK46guSX_yzwEkj040NPcv05H4uZsgh-_OR0tROrcC6fBP3VC5BuhGgU8b-BwsQHmEgNPp5F/pub?output=csv";

    let dadosDepartamentos = [];
    let depAtual = null;

    // Função para buscar e converter o CSV
    function carregarCSV() {
      document.getElementById("loading").classList.remove("hidden");
      document.getElementById("view-lista").classList.add("hidden");

      Papa.parse(CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          dadosDepartamentos = results.data;
          renderizarDepartamentos();
          document.getElementById("loading").classList.add("hidden");
          document.getElementById("view-lista").classList.remove("hidden");
        },
        error: function(err) {
          alert("Erro ao ler o arquivo CSV. Verifique se o link está correto e publicado.");
          console.error(err);
        }
      });
    }

    // Exibir cards dos departamentos
    function renderizarDepartamentos() {
      const container = document.getElementById("grid-departamentos");
      container.innerHTML = "";

      dadosDepartamentos.forEach(dep => {
        const card = document.createElement("div");
        card.className = "bg-white p-5 rounded-[25px] shadow border border-gray-200 font-bold cursor-pointer hover:border-blue-500 transition";
        card.onclick = () => abrirDetalhes(dep.id);
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <h3 class="font-bold text-lg text-gray-800">${dep.nome}</h3>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Exibir os detalhes do setor
    function abrirDetalhes(id, pushHistory = true) {
      const dep = dadosDepartamentos.find(item => item.id === id);
      if (!dep) return;

      depAtual = dep;

      document.getElementById("detalhe-nome").innerText = dep.nome;
      document.getElementById("detalhe-capitao").innerText = dep.capitao || "A definir";
      document.getElementById("detalhe-congregacao").innerText = dep.congregacao || "Não informada";
      document.getElementById("detalhe-instrucoes").innerText = dep.instrucoes || "Sem instruções";

      const listaUl = document.getElementById("detalhe-voluntarios");
      listaUl.innerHTML = "";

      // Separa os nomes por ponto e vírgula na coluna "voluntarios"
      const listaNomes = dep.voluntarios ? dep.voluntarios.split(";") : [];

      if (listaNomes.length === 0 || !dep.voluntarios || dep.voluntarios.trim() === "" || dep.voluntarios.trim() === "-") {
        listaUl.innerHTML = "<li class='text-gray-400 italic list-none'>Nenhum irmão designado cadastrado ainda.</li>";
      } else {
        listaNomes.forEach(nome => {
          if (nome.trim()) {
            const li = document.createElement("li");
            li.innerText = nome.trim();
            listaUl.appendChild(li);
          }
        });
      }

      document.getElementById("view-lista").classList.add("hidden");
      document.getElementById("view-detalhes").classList.remove("hidden");

      // Adiciona estado ao histórico do navegador para permitir o botão/gesto de voltar do celular
      if (pushHistory) {
        history.pushState({ view: 'detalhes', id: id }, '', `#${id}`);
      }
    }

    // Abrir o modal da Ficha de Limpeza interpretando tags HTML
    function abrirFichaLimpeza() {
      if (!depAtual) return;

      document.getElementById("ficha-titulo").innerText = `Ficha: ${depAtual.nome}`;
      
      // Substitui o ponto e vírgula por quebra de linha <br> e usa innerHTML para processar tags como <b>
      const materiaisTexto = depAtual.materiais 
        ? depAtual.materiais.replace(/;/g, '<br>') 
        : "Não especificados.";
      
      document.getElementById("ficha-materiais").innerHTML = materiaisTexto;
      document.getElementById("ficha-durante").innerHTML = depAtual.instrucoes_durante || "Não especificado.";
      document.getElementById("ficha-fim").innerHTML = depAtual.instrucoes_fim || "Não especificado.";

      const modal = document.getElementById("modal-ficha");
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    // Fechar o modal da Ficha de Limpeza
    function fecharFichaLimpeza() {
      const modal = document.getElementById("modal-ficha");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    // Voltar para a tela inicial
    function voltarParaLista(fromPopState = false) {
      fecharFichaLimpeza();
      document.getElementById("view-detalhes").classList.add("hidden");
      document.getElementById("view-lista").classList.remove("hidden");

      if (!fromPopState && history.state && history.state.view === 'detalhes') {
        history.back();
      }
    }

    // Capturar o gesto/botão de voltar nativo do celular
    window.addEventListener('popstate', (event) => {
      fecharFichaLimpeza();
      if (event.state && event.state.view === 'detalhes') {
        abrirDetalhes(event.state.id, false);
      } else {
        voltarParaLista(true);
      }
    });

    // Inicializa na abertura da página
    carregarCSV();
  </script>
</body>
</html>
